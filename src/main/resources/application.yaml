vaadin:
  launch-browser: true

spring:
  application:
    name: support-system

  datasource:
    # Safely passes your clean variables over the IPv4 connection pooler on port 6543
    url: jdbc:postgresql://${DB_HOST}:6543/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080
