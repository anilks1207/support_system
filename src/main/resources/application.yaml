vaadin:
  launch-browser: true

spring:
  application:
    name: support-system

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080

---
# -----------------------------------------------------------------
# PROFILE: LOCAL DATABASE SETTINGS
# -----------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/support_system
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

