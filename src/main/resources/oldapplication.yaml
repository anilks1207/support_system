vaadin:
  launch-browser: true

spring:
  application:
    name: support-system

  datasource:
    url: jdbc:postgresql://localhost:5432/support_system
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true


  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080
